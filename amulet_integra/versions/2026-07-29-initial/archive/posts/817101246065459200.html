<header class="byline"><img class="avi" src="../assets/avatar.png" alt=""><a class="who" href="../index.html">concubine-hypergreen</a></header>
<div class="tpost" data-id="817101246065459200">
<p><a class="tumblr_blog" href="https://shencomix.tumblr.com/post/816985371343765504/my-fitness-coach-is-a-dark-wizard-complete">shencomix</a>:</p><blockquote><h1>My Fitness Coach is a Dark Wizard [Complete]</h1><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_0.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_0.png" data-orig-height="1875" data-orig-width="1500" alt="At the top of the comic it says &quot;MY FITNESS COACH IS A&quot; in yellow (first I and O replaced by a metal dumbbell and a cowbell weight respectively), and at the bottom of the comic it says &quot;DARK WIZARD&quot; in purple and blue with green smoke behind it, and the I replaced with e wizard tower.

Panel 1: Shen is sitting on a bench in a gym locker room, wearing a sweaty yellow tank-top (and sweating, himself), holding a water bottle, and talking to a guy with a towel slung over his shoulder. He has a disgruntled expression. He says &quot;Bro I never should've hired the dark wizard as my fitness coach.&quot;

Panel 2: A dark wizard is spotting Shen on the bench press. Shen is huffing lifting the weight. The dark wizard, who wears a red hood with grey horns and a purple cloak, and has a long pointy nose and fingers, small severe eyes, and a big dark brown beard and eyebrows, is saying &quot;The path to TRUE power is not these plebeian exercises, but to know the 7 ARCANE UTTERANCES.&quot;

Panel 3: Top-down view of Shen, sweating, frustrated, on the bench. &quot;THEN JUST TELL ME THE UTTERANCES!!&quot; he says.

Panel 4: View from Shen's perspective of the wizard's long nose and face looking down at him sternly. &quot;EARN THEM!!!!&quot; he yells." srcset="../media/817101246065459200_0.png 75w, ../media/817101246065459200_0.png 100w, ../media/817101246065459200_0.png 250w, ../media/817101246065459200_0.png 400w, ../media/817101246065459200_0.png 500w, ../media/817101246065459200_0.png 540w, ../media/817101246065459200_0.png 640w, ../media/817101246065459200_0.png 1280w, ../media/817101246065459200_0.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_1.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_1.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 1: Shen and the Dark Wizard are standing near the gym's big wall mirror. There is a dumbbell laying on the ground between them, closer to the mirror. Shen is leaning forward, one hand on his hips and the other pointing at the wizard, and saying &quot;Y'know, I'm not convinced you're even strong enough to BE a fitness coach.&quot;

Panel 2: Shen's hand points at the dumbbell on the ground near the mirror. He says &quot;Lift that dumbbell.&quot;

Panel 3: The Dark Wizard saying &quot;I already AM lifting it.&quot; Shen raises his arms in exasperated confusion, saying &quot;What??&quot;

Panel 4: Outside view of the gym. It, along with the chunk of earth it was standing on, is hovering in the air slightly, having dislodged itself from the ground below." srcset="../media/817101246065459200_1.png 75w, ../media/817101246065459200_1.png 100w, ../media/817101246065459200_1.png 250w, ../media/817101246065459200_1.png 400w, ../media/817101246065459200_1.png 500w, ../media/817101246065459200_1.png 540w, ../media/817101246065459200_1.png 640w, ../media/817101246065459200_1.png 1280w, ../media/817101246065459200_1.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_2.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_2.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 1: In the foreground, Shen is sweating and breathing heavily, resting his hands on his knees, having just run a mile on an outdoor track. Far away in the background, on the other side of the track, the Dark Wizard is holding a stopwatch and saying &quot;AN 8 MINUTE MILE?? AND YOU HOPE TO SURVIVE HEARING EVEN THE WEAKEST ARCANE UTTERANCE??&quot;

Panel 2: Shen stands up straight and swings around to look at the wizard. He raises his hands in an aggressive questioning pose and tells &quot;HOW FAST IS &gt;YOUR&lt; MILE??&quot;

Panel 3: The wizard has suddenly manifested right behind Shen and puts his long, bony hand on Shen's shoulder. Red sparks fly around them, as if the remnants of a teleportation spell. &quot;instantaneous,&quot; he hisses." srcset="../media/817101246065459200_2.png 75w, ../media/817101246065459200_2.png 100w, ../media/817101246065459200_2.png 250w, ../media/817101246065459200_2.png 400w, ../media/817101246065459200_2.png 500w, ../media/817101246065459200_2.png 540w, ../media/817101246065459200_2.png 640w, ../media/817101246065459200_2.png 1280w, ../media/817101246065459200_2.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_3.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_3.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 1: The gym from the previous Dark Wizard comics is floating in some sort of colorful space-like void, with chromatic stars and billows of space glitter casting rainbow reflections onto its surface. From inside the gym, the dark wizard says &quot;BEWARE!! FOR WE ARE NOW TRAVELING BETWIXT DIMENSIONS.&quot;

Panel 2: Closeup of the dark wizard's haggard face, dramatically bottom-lit with red. He says &quot;All manner of monsters lurk here.&quot;

Panel 3: A black girl with messy buns and teal-ish green glasses enters. She's carrying a grey gym bag and wearing a sports a dark brown sports bra and tights, and a shiny pink poofy crop jacket, along with shiny pink velcro sneakers. The bell hanging above the gym's door produces a &quot;DING&quot; as she enters, enthusiastically stepping in.

Panel 4: Shen looks at her, holding his green water bottle to his face, with the dark wizard lurking in the background. Shen says &quot;SHE seems pretty normal.&quot;

Panel 5: Shen spits out his drink as he sees her maxing out the leg press machine, her legs bulging with muscle and the footrest cracking under the pressure as the whole machine bends and threatens to fall apart." srcset="../media/817101246065459200_3.png 75w, ../media/817101246065459200_3.png 100w, ../media/817101246065459200_3.png 250w, ../media/817101246065459200_3.png 400w, ../media/817101246065459200_3.png 500w, ../media/817101246065459200_3.png 540w, ../media/817101246065459200_3.png 640w, ../media/817101246065459200_3.png 1280w, ../media/817101246065459200_3.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_4.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_4.png" data-orig-height="1875" data-orig-width="1500" alt="The panel scheme of the comic is all compressed down to the bottom of the image, as if the panels themselves are affected by gravity. The colors of the whole comic are running downwards and pooling at the bottom, and in fact the canvas itself is being pulled down from the top like cloth on a drying line, revealing a transparent background behind.

Panel 1: Shen is compressed against the ground, laying down like a frog, sweating with wide bulging eyes and going &quot;urkk&quot;

Panel 2: The Dark Wizard is also compressed against the ground, his arms folded formally behind his back, and his pointing nose piercing the ground, holding his head up and forming cracks. He says &quot;AH! It would appear we are passing through the 100x gravity dimension.&quot;

Panel 3: The 'monster' girl from the previous comic grabs up her gym back and says, holding her hands up enthusiastically, &quot;OH!! This is my stop!&quot;

Panel 4: The girl is lightly skipping out of the gym towards the exit as Shen and the Dark Wizard are still compressed against the ground in the background." srcset="../media/817101246065459200_4.png 75w, ../media/817101246065459200_4.png 100w, ../media/817101246065459200_4.png 250w, ../media/817101246065459200_4.png 400w, ../media/817101246065459200_4.png 500w, ../media/817101246065459200_4.png 540w, ../media/817101246065459200_4.png 640w, ../media/817101246065459200_4.png 1280w, ../media/817101246065459200_4.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_5.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_5.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 1: Shen is on a stairmaster machine at the gym. The dark wizard stands beside him as he walks on it. Shen is sweating and breathing heavily, pivoted slightly to look at the dark wizard, saying &quot;WIZARD! How is this STAIRS MACHINE going to bring me closer to the utterances??&quot;

Panel 2: The wizard looks up at him with a severe expression and replies &quot;To those possessing patience and will ... ALL truths reveal themselves.&quot;

Panel 3: A wizard tower build on a small stone outcropping in the ocean. Waves crash against it and lightning strikes in the background as a storm rages. A small boat is docked against a staircase carved into the outcropping.

Panel 4: Shen is ascending the spiral staircase of the tower with a zweihander sword. The staircase, lined with torches, stretches down seemingly endlessly. Shen sweats and breaths heavily, mumbling &quot;fuckin' tall-ass wizard towers&quot;" srcset="../media/817101246065459200_5.png 75w, ../media/817101246065459200_5.png 100w, ../media/817101246065459200_5.png 250w, ../media/817101246065459200_5.png 400w, ../media/817101246065459200_5.png 500w, ../media/817101246065459200_5.png 540w, ../media/817101246065459200_5.png 640w, ../media/817101246065459200_5.png 1280w, ../media/817101246065459200_5.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_6.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_6.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 1: Shen is bursting into the top chamber of the Dark Wizard's tower with his zweihander, tired and sweating, yelling &quot;WIZARD!!! YOU'VE JERKED ME AROUND ENOUGH.&quot; The &quot;A&quot; in &quot;WIZARD&quot; is written in the sharp way that the Dark Wizard usually writes it, and has the Dark Wizard's light purple text background color.

Panel 2: The reflection of the Wizard's form gleams in Shen's sword and a vein bulges on Shen's forehead as he says &quot;TELL ME THE UTTERANCES. OR THESE ARE THE LAST MOMENTS OF YOUR WRETCHED LIFE&quot;

Panel 3: The Wizard stands at his window, a thunderstorm raging outside. A lightning strike illuminates the room, casting his long shadow down at, with a &quot;KRAKOOOoom&quot;. He is surrounded but tomes, scrolls, and potions, as well as a skull on a table with a candle on it.

Panel 4: The Dark Wizard's eyes and concealed by the shadow of his hood as he replies. &quot;The utterances ... are a burden.&quot;" srcset="../media/817101246065459200_6.png 75w, ../media/817101246065459200_6.png 100w, ../media/817101246065459200_6.png 250w, ../media/817101246065459200_6.png 400w, ../media/817101246065459200_6.png 500w, ../media/817101246065459200_6.png 540w, ../media/817101246065459200_6.png 640w, ../media/817101246065459200_6.png 1280w, ../media/817101246065459200_6.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_7.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_7.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 5: We now see the Dark Wizard's face, not carrying its characteristic 'evil' expression, but instead somber, contemplative, a little sad. He says &quot;I spent my years seeking a spell that would allow me to FORGET them. REVERSE the cogs of time. But alas, some things are beyond the reach of even magic.&quot;
 
Panel 6: The Wizard pivots back towards Shen as another bolt of lighting strikes in the window behind him with a &quot;KRAKOOOoom&quot;. He says &quot;I will not teach you the utterances. This is the end of our coaching sessions.&quot;

Panel 7: Shen, enraged, spitting, raising the sword above his head, looking more evil that the Dark Wizard at this point, yells &quot;THEN DIE&quot;

Panel 8: Shen lunches forward and swings the sword down towards the wizard's head with all his might, passing a couple of wall-mounted scrolls now visible in the background. The arc of the swing forms purple clouds that seem to swirl around the whole scene, distorting it." srcset="../media/817101246065459200_7.png 75w, ../media/817101246065459200_7.png 100w, ../media/817101246065459200_7.png 250w, ../media/817101246065459200_7.png 400w, ../media/817101246065459200_7.png 500w, ../media/817101246065459200_7.png 540w, ../media/817101246065459200_7.png 640w, ../media/817101246065459200_7.png 1280w, ../media/817101246065459200_7.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_8.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_8.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 1: Shen's zweihander rebounds against what has suddenly become a stone statue of the Dark Wizard, rather than the Dark Wizard himself. He and the statue are in a large field, and the statue is crumbled in places and covered with moss on the shoulders and head. It is raining.

Panel 2: Shen pivots his zweihander to his right and looks that way, searching angrily for the wizard, yelling &quot;COWARD. WHERE HAVE YOU FLED?? TO WHAT REALM HAVE YOU SENT US???&quot;

Panel 3: An overhead few reveals that the field is a graveyard, and the statue, likely a gravestone. There's a mausuleum and another wizard statue with an offering of food and flowers before it, as well as several standard gravestones.

Panel 4: Closeup of the wizard statue's face, looking forward stoically, as rain continues to fall on it." srcset="../media/817101246065459200_8.png 75w, ../media/817101246065459200_8.png 100w, ../media/817101246065459200_8.png 250w, ../media/817101246065459200_8.png 400w, ../media/817101246065459200_8.png 500w, ../media/817101246065459200_8.png 540w, ../media/817101246065459200_8.png 640w, ../media/817101246065459200_8.png 1280w, ../media/817101246065459200_8.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_9.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_9.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 5: Closeup of Shen looking up at the wizard statue's face, the rain hitting him and pouring down his face and body.

Panel 6: Shen shifts his gaze to look downwards.

Panel 7: At the base of the statue is an inscription, reading: &quot;Death is the shadow of life. Only in darkness may they become one.&quot; To the left and right of the inscription are an upside down and rightside up engraving of a closed flower pod.

Panel 8: Side view of Shen looking down at the inscription as the rain becomes more sparse and beams of sunlight are seen beginning to appear in the sky behind him." srcset="../media/817101246065459200_9.png 75w, ../media/817101246065459200_9.png 100w, ../media/817101246065459200_9.png 250w, ../media/817101246065459200_9.png 400w, ../media/817101246065459200_9.png 500w, ../media/817101246065459200_9.png 540w, ../media/817101246065459200_9.png 640w, ../media/817101246065459200_9.png 1280w, ../media/817101246065459200_9.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_10.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_10.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 9: Shen stabs the zweihander into the ground in front of the statue with a &quot;HNPH&quot; and &quot;SHK&quot;.

Panel 10: Shen turns around and begins to walk away from the statue, muttering to himself, &quot;fuckin' ... dark-ass wizard&quot;. The rain has now fully stopped as beams of light pierce the sky prominently, the dark clouds beginning to recede." srcset="../media/817101246065459200_10.png 75w, ../media/817101246065459200_10.png 100w, ../media/817101246065459200_10.png 250w, ../media/817101246065459200_10.png 400w, ../media/817101246065459200_10.png 500w, ../media/817101246065459200_10.png 540w, ../media/817101246065459200_10.png 640w, ../media/817101246065459200_10.png 1280w, ../media/817101246065459200_10.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_11.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_11.png" data-orig-height="1875" data-orig-width="1500" alt='Panel 1: Shen is standing on a beach at dusk with a somber expression, wearing teal swim trunks, holding his phone in his right hand, and staring out into the ocean. He is absolutely yolked.

Panel 2: Two random passers-by, a man and a woman, are walking in the shallow water, the sunset illuminating them from behind. The man, who is wearing purple swim trunks, says "Woah dude, how did you work out to get a body like that?"

Panel 3: Shen, his expression vaguely said and exhausted, replies "I hired a dark wizard as my fitness coach, was blinded by his promise of 7 arcane utterances, which he spoke of often as the ultimate source of power but in the end refused to burden me with, and so I tried to kill the wizard, but then it turned out that he was dead all along and projecting his soul into my mind and I was just at the gym talking to nobody that whole time."

Panel 4: The guy passer-by does a peace sign with his left hand and says "Ha ha! Alright, keep your secrets then! ~". The girl, who is wearing a pink one-piece bathing suit and holding a green-and-blue beach ball, giggles.' srcset="../media/817101246065459200_11.png 75w, ../media/817101246065459200_11.png 100w, ../media/817101246065459200_11.png 250w, ../media/817101246065459200_11.png 400w, ../media/817101246065459200_11.png 500w, ../media/817101246065459200_11.png 540w, ../media/817101246065459200_11.png 640w, ../media/817101246065459200_11.png 1280w, ../media/817101246065459200_11.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div><div class="npf_row"><figure class="tmblr-full" data-orig-height="1875" data-orig-width="1500"><a class="imglink" href="../media/817101246065459200_12.png" target="_blank" rel="noopener"><img src="../media/817101246065459200_12.png" data-orig-height="1875" data-orig-width="1500" alt="Panel 5: Shen lets out a deep sigh. The light of the sunset begins to blend the pinks, yellow, and oranges of the sky and beach behind him.

Panel 6: Shen holds his phone up and looks at it pensively.

Panel 7: On the phone, the app that he was using for hiring a fitness coach has prompted him to &quot;please rate your coach&quot;, showing the profile pic of the Dark Wizard, revealed to be named Darchilius W, looking as severe as ever. Below that is a line of stars, prompting Shen to rate 0-5 stars, a comment box, a submit button, and the profile pics of other, more normal looking coaches, including 'Steph A.', 'Jay M.', and 'Lorenzo G.'

Panel 8: Shen presses down with his thumb, rating the wizard 5 stars. Fin." srcset="../media/817101246065459200_12.png 75w, ../media/817101246065459200_12.png 100w, ../media/817101246065459200_12.png 250w, ../media/817101246065459200_12.png 400w, ../media/817101246065459200_12.png 500w, ../media/817101246065459200_12.png 540w, ../media/817101246065459200_12.png 640w, ../media/817101246065459200_12.png 1280w, ../media/817101246065459200_12.png 1500w" sizes="(max-width: 1280px) 100vw, 1280px"></a><span class="tmblr-alt-text-helper">ALT</span></figure></div></blockquote>
