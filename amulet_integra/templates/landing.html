<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>amulet integra</title><style>:root{color-scheme:dark;--g:#00cf35;--b:#00b8ff;--bg:#05070a;--line:#25313a;--muted:#aab5c0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#071b19,transparent 35%),radial-gradient(circle at 80% 70%,#11102a,transparent 40%),var(--bg);color:#f7fafc;font-family:"Favorit Tumblr 85","Segoe UI",sans-serif}main{width:min(760px,calc(100% - 28px));padding:28px;border:1px solid var(--line);border-radius:24px;background:#070a0fe8}h1{font-size:clamp(2.8rem,9vw,6rem);line-height:.85;letter-spacing:-.07em;margin:0 0 24px}a{color:var(--b)}#current{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:10px 16px;text-decoration:none;color:var(--g)}ol{padding-left:22px}li{margin:10px 0}.meta{color:var(--muted);font-size:.82rem}</style></head><body><main><h1>amulet<br>integra</h1><p><a id="current" href="#">open current version</a></p><div id="versions" class="meta">loading versions…</div></main><script>Promise.all([fetch('current.json').then(r=>r.json()),fetch('versions.json').then(r=>r.json())]).then(([current,catalogue])=>{const link=document.querySelector('#current');if(current.path)link.href=current.path;else{link.removeAttribute('href');link.textContent='no validated version yet'}const versions=[...(catalogue.versions||[])].reverse();document.querySelector('#versions').innerHTML=versions.length?'<ol>'+versions.map(item=>'<li><a href="'+item.path+'">'+item.id+'</a><div>'+item.summary+'</div></li>').join('')+'</ol>':'no versions yet'}).catch(error=>document.querySelector('#versions').textContent=error.message);</script></body></html>
