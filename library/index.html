<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="color-scheme" content="dark light">
  <title>Katherine's Stacks</title>
  <style>
    :root{--bg:#09100c;--panel:#101a14;--ink:#edf8f0;--muted:#9eb1a3;--line:#294035;--green:#43e47c;--blue:#58b8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0,rgba(67,228,124,.14),transparent 35rem),radial-gradient(circle at 90% 0,rgba(88,184,255,.12),transparent 30rem),var(--bg)}main{width:min(760px,100%);border:1px solid var(--line);border-radius:20px;padding:34px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.28)}.eyebrow{font-size:.76rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800}h1{margin:10px 0 0;font-size:clamp(3rem,10vw,6.4rem);line-height:.84;letter-spacing:-.07em}.g{color:var(--green)}.b{color:var(--blue)}p{color:var(--muted);line-height:1.6;font-size:1.02rem;max-width:630px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}a{display:inline-flex;text-decoration:none;border-radius:12px;padding:12px 16px;font-weight:820;border:1px solid var(--line);color:var(--ink)}a.primary{background:var(--green);color:#07110a;border-color:transparent}.note{font-size:.82rem;color:var(--muted);margin-top:14px}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">personal library</div>
  <h1><span class="g">Katherine's</span><br><span class="b">Stacks</span></h1>
  <p>Stacks is now a local catalog shell rather than a browser skin. Search, browse, themes, and record inspection live in its own interface.</p>
  <div class="actions"><a class="primary" href="http://127.0.0.1:8765/">Open Stacks</a></div>
  <div class="note">The local Stacks service needs to be running on this computer.</div>
</main>
</body>
</html>
