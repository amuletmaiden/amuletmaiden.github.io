<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>leaf sprite laboratory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#8b9aa0;font-family:"Courier New",monospace}
body{overflow:auto}
#lab{display:block;width:100%;height:auto;background:#000;cursor:crosshair}
#hint{position:fixed;right:12px;top:10px;z-index:2;font-size:10px;line-height:1.5;color:#526269;text-align:right;pointer-events:none;mix-blend-mode:screen}
#hint b{color:#9aabb1;font-weight:400}
@media(max-width:700px){#hint{display:none}}
</style>
</head>
<body>
<canvas id="lab"></canvas>
<div id="hint"><b>live canvas implementations</b><br>click a candidate to mark it<br>space: black / field test</div>
<script src="sprites.js"></script>
</body>
</html>
