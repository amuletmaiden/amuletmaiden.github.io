name: Export accepted dragon close audit

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload close dragon audit
        uses: actions/upload-artifact@v4
        with:
          name: dragon-runtime-close-audit
          path: kt-bus-review/dragon_runtime_close_audit.zip
          if-no-files-found: error
          retention-days: 1
