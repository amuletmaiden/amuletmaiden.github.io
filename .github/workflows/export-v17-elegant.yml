name: Export v17 elegant renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v17 elegant renders
        uses: actions/upload-artifact@v4
        with:
          name: v17-elegant-renders
          path: dragon-review/v17_elegant_*.jpg
          if-no-files-found: error
          retention-days: 1
