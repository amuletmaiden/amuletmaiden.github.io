name: Export D0E anatomy closeups

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload D0E closeups
        uses: actions/upload-artifact@v4
        with:
          name: d0e-anatomy-closeups
          path: kt-bus-review/D0E_anatomy_closeups_review.zip
          if-no-files-found: error
          retention-days: 1
