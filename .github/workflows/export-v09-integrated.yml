name: Export v09 integrated renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v09 integrated renders
        uses: actions/upload-artifact@v4
        with:
          name: v09-integrated-renders
          path: dragon-review/v09_integrated_*.jpg
          if-no-files-found: error
          retention-days: 1
