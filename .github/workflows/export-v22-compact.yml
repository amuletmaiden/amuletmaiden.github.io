name: Export v22 compact renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v22 compact renders
        uses: actions/upload-artifact@v4
        with:
          name: v22-compact-renders
          path: dragon-review/v22_compact_*.jpg
          if-no-files-found: error
          retention-days: 1
