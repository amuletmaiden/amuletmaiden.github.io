name: Export v16 severe renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v16 severe renders
        uses: actions/upload-artifact@v4
        with:
          name: v16-severe-renders
          path: dragon-review/v16_severe_*.jpg
          if-no-files-found: error
          retention-days: 1
