name: Export v11 unified renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v11 unified renders
        uses: actions/upload-artifact@v4
        with:
          name: v11-unified-renders
          path: dragon-review/v11_unified_*.jpg
          if-no-files-found: error
          retention-days: 1
