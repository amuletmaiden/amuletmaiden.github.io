name: Export v31 fullbody review
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Blender fullbody review renders
        uses: actions/upload-artifact@v4
        with:
          name: v31-fullbody-review
          path: |
            dragon-review/v31_rig_pose_full34.jpg
            dragon-review/v31_rig_pose_profile.jpg
            dragon-review/v31_rig_pose_front.jpg
          if-no-files-found: error
