name: Export dragon C1 review

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact C1 renders
        uses: actions/upload-artifact@v4
        with:
          name: dragon-C1-review
          path: kt-bus-review/dragon-C1/*.jpg
          retention-days: 1
