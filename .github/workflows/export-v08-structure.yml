name: Export v08 structure renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v08 structure renders
        uses: actions/upload-artifact@v4
        with:
          name: v08-structure-renders
          path: dragon-review/v08_structure_*.jpg
          if-no-files-found: error
          retention-days: 1
