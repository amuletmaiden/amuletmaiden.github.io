name: Export v07 baseline renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v07 baselines
        uses: actions/upload-artifact@v4
        with:
          name: v07-baseline-renders
          path: dragon-review/v07_before_*.jpg
          if-no-files-found: error
          retention-days: 1
