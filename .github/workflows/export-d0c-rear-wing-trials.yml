name: Export D0C rear wing cut trials

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload D0C trial review
        uses: actions/upload-artifact@v4
        with:
          name: d0c-rear-wing-trials
          path: kt-bus-review/D0C_rear_wing_cut_trials_review.zip
          if-no-files-found: error
          retention-days: 1
