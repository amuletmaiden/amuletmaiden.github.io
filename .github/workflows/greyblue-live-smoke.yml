name: Greyblue live smoke

on:
  push:
    branches: [main]
    paths:
      - "greyblue-archipelago/**"
      - ".github/workflows/greyblue-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greyblue-live-smoke
  cancel-in-progress: true

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate deployed Greyblue build
        env:
          GREYBLUE_URL: https://amuletmaiden.github.io/greyblue-archipelago/
        run: node greyblue-archipelago/tests/live-smoke.mjs
