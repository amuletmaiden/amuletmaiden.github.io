name: Export D2 Dragon Review

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload D2 dragon review
        uses: actions/upload-artifact@v4
        with:
          name: d2-dragon-review
          path: kt-bus-review/D2_predatory_scaffold_review.zip
          if-no-files-found: error
          retention-days: 1
