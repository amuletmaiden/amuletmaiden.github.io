name: Export D0D clean tapered tail review

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload D0D review
        uses: actions/upload-artifact@v4
        with:
          name: d0d-clean-tail
          path: kt-bus-review/D0D_clean_tapered_tail_review.zip
          if-no-files-found: error
          retention-days: 1
