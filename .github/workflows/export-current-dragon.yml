name: Export v34 stable IK review

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Blender v34 stable IK renders
        uses: actions/upload-artifact@v4
        with:
          name: v34-stable-ik-review
          path: |
            dragon-review/v34_stable_ik_rest.jpg
            dragon-review/v34_stable_ik_pose.jpg
          if-no-files-found: error
          retention-days: 1
