name: Export current dragon render

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Blender render
        uses: actions/upload-artifact@v4
        with:
          name: current-dragon-render
          path: current-dragon.jpg
          if-no-files-found: error
          retention-days: 1
