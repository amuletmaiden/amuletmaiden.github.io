name: Export v33 animator review

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Blender v33 animator renders
        uses: actions/upload-artifact@v4
        with:
          name: v33-animator-review
          path: |
            dragon-review/v33_controls_rest.jpg
            dragon-review/v33_animation_pose.jpg
          if-no-files-found: error
          retention-days: 1
