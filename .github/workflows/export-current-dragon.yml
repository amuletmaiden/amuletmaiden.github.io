name: Export v31 rig review

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Blender rig renders
        uses: actions/upload-artifact@v4
        with:
          name: v31-rig-review
          path: |
            dragon-review/v31_game_rig_rest.jpg
            dragon-review/v31_rig_pose_validation.jpg
          if-no-files-found: error
          retention-days: 1
