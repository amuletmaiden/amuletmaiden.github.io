name: Export v14 refined renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v14 refined renders
        uses: actions/upload-artifact@v4
        with:
          name: v14-refined-renders
          path: dragon-review/v14_refined_*.jpg
          if-no-files-found: error
          retention-days: 1
