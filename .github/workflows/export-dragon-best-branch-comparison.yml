name: Export dragon best branch comparison

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload branch comparison
        uses: actions/upload-artifact@v4
        with:
          name: dragon-best-branch-comparison
          path: kt-bus-review/dragon_best_branch_comparison.zip
          if-no-files-found: error
          retention-days: 1
