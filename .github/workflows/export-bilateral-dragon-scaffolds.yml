name: Export Bilateral Dragon Scaffolds

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload bilateral dragon scaffolds
        uses: actions/upload-artifact@v4
        with:
          name: bilateral-dragon-scaffolds
          path: kt-bus-review/bilateral_scaffolds.zip
          if-no-files-found: error
          retention-days: 1
