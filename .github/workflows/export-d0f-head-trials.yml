name: Export D0F head proportion trials

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload D0F head trials
        uses: actions/upload-artifact@v4
        with:
          name: d0f-head-trials
          path: kt-bus-review/D0F_head_trials_review.zip
          if-no-files-found: error
          retention-days: 1
