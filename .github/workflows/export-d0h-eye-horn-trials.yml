name: Export D0H eye and horn trials

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload D0H trial review
        uses: actions/upload-artifact@v4
        with:
          name: d0h-eye-horn-trials
          path: kt-bus-review/D0H_eye_horn_trials_review.zip
          if-no-files-found: error
          retention-days: 1
