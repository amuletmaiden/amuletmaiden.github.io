name: Export v13 clean renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v13 clean renders
        uses: actions/upload-artifact@v4
        with:
          name: v13-clean-renders
          path: dragon-review/v13_clean_*.jpg
          if-no-files-found: error
          retention-days: 1
