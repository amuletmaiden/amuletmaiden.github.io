name: Export v15 anatomical renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v15 anatomical renders
        uses: actions/upload-artifact@v4
        with:
          name: v15-anatomical-renders
          path: dragon-review/v15_anatomical_*.jpg
          if-no-files-found: error
          retention-days: 1
