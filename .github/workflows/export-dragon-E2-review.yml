name: Export dragon E2 review

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload E2 review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dragon-E2-review
          path: kt-bus-review/dragon_E2_review.zip
          if-no-files-found: error
          retention-days: 1
