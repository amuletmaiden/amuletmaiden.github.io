name: Export v12 predatory renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact v12 predatory renders
        uses: actions/upload-artifact@v4
        with:
          name: v12-predatory-renders
          path: dragon-review/v12_predatory_*.jpg
          if-no-files-found: error
          retention-days: 1
