name: Export v20 donor final renders
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact donor evaluation renders
        uses: actions/upload-artifact@v4
        with:
          name: v20-donor-final-renders
          path: dragon-review/v20_donor_*.jpg
          if-no-files-found: error
          retention-days: 1
