name: Export D0G austere mountain review

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload D0G review
        uses: actions/upload-artifact@v4
        with:
          name: d0g-austere-mountain
          path: kt-bus-review/D0G_austere_mountain_review.zip
          if-no-files-found: error
          retention-days: 1
