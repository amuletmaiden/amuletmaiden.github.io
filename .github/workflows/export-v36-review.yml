name: Export current dragon review

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Blender v38 review
        uses: actions/upload-artifact@v4
        with:
          name: v38-dragon-review
          path: dragon-review/v38_review_small.jpg
          retention-days: 1
