name: Export v36 dragon review

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Blender v36 review
        uses: actions/upload-artifact@v4
        with:
          name: v36-dragon-review
          path: dragon-review/v36_review_small.jpg
          retention-days: 1
