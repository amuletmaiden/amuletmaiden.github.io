name: Build Rationality Library EPUB

on:
  push:
    paths:
      - '.github/workflows/build-rationality-library-epub.yml'
  pull_request:
    paths:
      - '.github/rationality-library-build-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
      - name: Fetch 2015 CC-licensed source
        run: |
          git clone --depth 1 --branch master_lite https://github.com/jrincayc/rationality-ai-zombies.git src
      - name: Build EPUB
        run: |
          pandoc \
            src/macros.tex \
            src/front.tex \
            src/map_and_territory.tex \
            src/change_mind.tex \
            src/machine_in_ghost.tex \
            src/mere_reality.tex \
            src/mere_goodness.tex \
            src/becoming_stronger.tex \
            src/bibliography.tex \
            --from=latex \
            --to=epub3 \
            --resource-path=src \
            --metadata='title:Rationality: From AI to Zombies' \
            --metadata='author:Eliezer Yudkowsky' \
            --metadata='date:2015' \
            --toc \
            -o 'Rationality From AI to Zombies.epub'
          unzip -t 'Rationality From AI to Zombies.epub'
      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rationality-library-epub
          path: Rationality From AI to Zombies.epub
          if-no-files-found: error
          retention-days: 1
